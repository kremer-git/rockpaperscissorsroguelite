<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rock Paper Scissors Roguelite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a card table. Felt-green play surface, card-stock upgrade cards, one colour per skill tree.
   Committed single look (a game table), so colours are set explicitly for every host theme. */
:root {
  color-scheme: dark;
  --felt: #173129;
  --felt-deep: #10241e;
  --panel: #1e3d34;
  --line: #2f5a4e;
  --ink: #edf1e8;
  --muted: #a7bdb2;
  --card: #f1ecdf;
  --card-ink: #1e211f;
  --card-muted: #5d625d;
  --gold: #e8b949;
  --rock: #a9b6c3;
  --paper: #86b9ef;
  --scissors: #f2825a;
  --win: #7ad696;
  --tie: #e4dca8;
  --loss: #ff7b72;
  --save: #b69cf2;
  --r-common: #a7aea9; --r-uncommon: #63c690; --r-rare: #ff74b8; --r-epic: #bd92f2; --r-legendary: #f1bb4c;
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 10px;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 20%, var(--felt) 0%, var(--felt-deep) 85%) fixed, var(--felt-deep);
  color: var(--ink); font: 16px/1.5 var(--f-body); margin: 0;
}
.app { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
button, input, select { font: inherit; }
kbd { font: 700 0.72rem/1 var(--f-mono); padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .75; margin-left: .5em; }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: .86rem; }
.muted { color: var(--muted); }
.strong { font-weight: 700; }
.eyebrow { font: 700 .72rem/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .25em; border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  padding: .55em 1em; border-radius: 8px; cursor: pointer; font-weight: 700; transition: transform .08s, background .15s, border-color .15s; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: #231a05; border-color: var(--gold); }
.btn.primary:hover:not(:disabled) { background: #f4c85c; }
.btn.danger { background: var(--loss); color: #2a0806; border-color: var(--loss); }
.btn.big { font-size: 1.08rem; padding: .75em 1.3em; }
.btn.small { font-size: .8rem; padding: .35em .6em; }

/* ---------- assets / chips ---------- */
.asset { display: inline-grid; place-items: center; line-height: 1; }
.move-chip { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 2.1em; height: 2.1em; border-radius: 50%;
  background: var(--tint, var(--rock)); color: #15201c; font-weight: 700; border: 2px solid rgba(0,0,0,.25); }
.move-chip .chip-letter { display: none; }
.move-chip.tree-rock { --tint: var(--rock); } .move-chip.tree-paper { --tint: var(--paper); } .move-chip.tree-scissors { --tint: var(--scissors); }
.move-chip.big { width: 4.2rem; height: 4.2rem; font-size: 1.9rem; }
.move-chip.huge { width: 5.5rem; height: 5.5rem; font-size: 2.6rem; }
.move-chip.tiny { width: 1.3rem; height: 1.3rem; font-size: .7rem; vertical-align: middle; }
.tree-text-rock { color: var(--rock); } .tree-text-paper { color: var(--paper); } .tree-text-scissors { color: var(--scissors); }

/* ---------- title ---------- */
.screen.title { min-height: 80vh; display: grid; align-content: center; justify-items: center; text-align: center; gap: 28px; }
.title-hands { display: flex; gap: 14px; justify-content: center; }
.title-hands .move-chip:nth-child(1) { transform: rotate(-8deg); } .title-hands .move-chip:nth-child(3) { transform: rotate(8deg); }
.logo { font: 900 clamp(3rem, 11vw, 7.5rem)/.86 var(--f-display); text-transform: uppercase; letter-spacing: .01em; display: flex; flex-direction: column; margin-top: 18px; }
.logo span:nth-child(1) { color: var(--rock); } .logo span:nth-child(2) { color: var(--paper); } .logo span:nth-child(3) { color: var(--scissors); }
.logo-sub { font: 800 clamp(1.1rem, 3vw, 1.6rem)/1 var(--f-display); letter-spacing: .5em; text-transform: uppercase; color: var(--gold); margin: 12px 0 0; padding-left: .5em; }
.tagline { max-width: 52ch; color: var(--muted); margin: 14px auto 0; }
.title-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.title-facts { list-style: none; padding: 0; margin: 0; display: flex; gap: 8px 22px; flex-wrap: wrap; justify-content: center; color: var(--muted); }
.title-facts li::before { content: '◆ '; color: var(--gold); }
.foot { text-align: center; }

/* ---------- how to ---------- */
.screen.howto { min-height: 80vh; display: grid; place-items: center; }
.card { background: var(--card); color: var(--card-ink); border-radius: var(--radius); box-shadow: 0 10px 28px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.4) inset; }
.card .eyebrow { color: var(--card-muted); }
.howto-card { max-width: 560px; width: 100%; padding: 32px; display: grid; gap: 14px; }
.howto-card h2 { font: 800 2.6rem/1 var(--f-display); text-transform: uppercase; }
.howto-body { font-size: 1.12rem; margin: 0; }
.howto-dots { list-style: none; display: flex; gap: 8px; padding: 0; margin: 4px 0; }
.howto-dots li { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--card-muted); }
.howto-dots li.done { background: var(--card-muted); } .howto-dots li.on { background: var(--card-ink); border-color: var(--card-ink); transform: scale(1.25); }
.howto-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.howto-card .btn:not(.primary) { background: transparent; color: var(--card-ink); border-color: #c9c2b1; }

/* ---------- HUD ---------- */
.hud { display: grid; grid-template-columns: auto auto auto 1fr auto; gap: 8px 24px; align-items: end; padding: 14px 18px; background: var(--felt-deep); border: 1px solid var(--line); border-radius: var(--radius); }
.hud-stat { display: grid; gap: 2px; }
.hud-num { font: 800 2rem/1 var(--f-display); display: inline-flex; align-items: center; gap: .2em; }
.hud-num.danger { color: var(--loss); }
.hud-glyph { color: var(--gold); font-family: var(--f-body); font-size: .8em; }
[data-fx="lives"] .hud-glyph { color: var(--loss); }
.progress-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.progress-track { height: 12px; background: var(--panel); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.progress-fill { height: 100%; background: repeating-linear-gradient(45deg, var(--gold), var(--gold) 8px, #d6a53a 8px, #d6a53a 16px); transition: width .25s; }

/* ---------- run layout ---------- */
.run-grid { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr) minmax(240px, 300px); gap: 14px; margin-top: 12px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.panel-title { font: 800 1.4rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.opp-head { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.portrait { width: 64px; height: 64px; border-radius: 12px; background: var(--card); color: var(--card-ink); display: grid; place-items: center; font: 900 1.5rem/1 var(--f-display); box-shadow: 0 4px 10px rgba(0,0,0,.3); }
.portrait.small { width: 48px; height: 48px; font-size: 1.1rem; }
.portrait.tiny { width: 28px; height: 28px; font-size: .75rem; border-radius: 6px; flex: none; }
.opp-id h2 { font: 800 1.8rem/1 var(--f-display); margin-top: 4px; }
.opp-title { color: var(--gold); font-weight: 700; }
.opp-tell { margin: 8px 0 0; font-size: .92rem; padding: 8px 10px; border-radius: 8px; background: rgba(134,185,239,.12); border-left: 3px solid var(--paper); }
.opp-tell.locked { background: rgba(255,255,255,.04); border-left-color: var(--line); color: var(--muted); }
.intel { display: grid; gap: 14px; }
.legend { margin: 2px 0 6px; }
.note { color: var(--muted); font-style: italic; }

/* ---------- arena ---------- */
.arena { display: grid; gap: 16px; min-width: 0; }
.result { background: var(--felt-deep); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; display: grid; gap: 10px; justify-items: center; text-align: center; min-height: 190px; align-content: center; }
.result.idle .idle-line { font: 800 1.6rem/1.1 var(--f-display); text-transform: uppercase; margin: 0; }
.result.idle p { margin: 0; max-width: 46ch; }
.clash { display: flex; align-items: center; gap: 22px; }
.clash-side { display: grid; justify-items: center; gap: 6px; }
.clash-name { font-weight: 700; }
.vs { font: 800 1.2rem/1 var(--f-display); color: var(--muted); text-transform: uppercase; }
.banner { display: grid; gap: 2px; }
.banner-word { font: 900 clamp(2.6rem, 7vw, 4.2rem)/.9 var(--f-display); letter-spacing: .04em; }
.banner-quip { color: var(--muted); font-style: italic; }
.out-win .banner-word { color: var(--win); } .out-tie .banner-word { color: var(--tie); } .out-loss .banner-word { color: var(--loss); } .out-saved .banner-word { color: var(--save); }
.triggers { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.trig { font-size: .82rem; padding: 3px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.trig.coin { background: var(--gold); color: #231a05; border-color: var(--gold); font-weight: 700; }
.trig.life { background: var(--loss); color: #2a0806; border-color: var(--loss); font-weight: 700; }
.throws { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.throw { display: grid; justify-items: center; gap: 6px; padding: 16px 8px 14px; border-radius: 14px; cursor: pointer; background: var(--card); color: var(--card-ink); border: 3px solid transparent;
  box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s, border-color .15s; min-width: 0; }
.throw:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 9px 0 rgba(0,0,0,.35); }
.throw:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.throw:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.throw.selected { border-color: var(--gold); }
.throw-art { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 2.3rem; color: #15201c; border: 3px solid rgba(0,0,0,.18); }
.throw.tree-rock .throw-art { background: var(--rock); } .throw.tree-paper .throw-art { background: var(--paper); } .throw.tree-scissors .throw-art { background: var(--scissors); }
.throw-name { font: 900 1.7rem/1 var(--f-display); text-transform: uppercase; }
.throw-meta { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; font-size: .78rem; }
.throw-meta kbd { margin: 0; }
.save-tag { background: #2e2750; color: #eee8ff; padding: 2px 7px; border-radius: 999px; font-weight: 700; }
.save-tag.none { background: transparent; color: var(--card-muted); font-weight: 400; }
.tax-tag { background: #5a2019; color: #ffe2dc; padding: 2px 7px; border-radius: 999px; font-weight: 700; }
.allin { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 10px 14px; border: 2px dashed var(--scissors); border-radius: 10px; cursor: pointer; font-size: .92rem; flex-wrap: wrap; }
.allin.on { background: rgba(242,130,90,.18); }
.allin input { width: 20px; height: 20px; accent-color: var(--scissors); }

/* ---------- build ---------- */
.build { display: grid; gap: 12px; }
.build > p { margin: 0; }
.build ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px; }
.build-item { display: grid; gap: 2px;  padding: 7px 9px; border-radius: 8px; background: var(--felt-deep); border-left: 4px solid var(--rock); }
.build-item.tree-paper { border-left-color: var(--paper); } .build-item.tree-scissors { border-left-color: var(--scissors); }
.build-name { font-weight: 700; }
.build-item summary { display: flex; justify-content: space-between; gap: 8px; cursor: pointer; list-style: none; }
.build-item summary::-webkit-details-marker { display: none; }
.build-item details[open] summary { margin-bottom: 4px; }
.build-desc { display: block; color: var(--muted); }
.scaling { font: 700 .76rem/1.3 var(--f-mono); color: var(--gold); }
.stacks { color: var(--gold); }
.pip-dot { font-size: .6rem; letter-spacing: 1px; }
.pip-dot.rarity-common, .rarity-common .pips { color: var(--r-common); }
.pip-dot.rarity-uncommon, .rarity-uncommon .pips { color: var(--r-uncommon); }
.pip-dot.rarity-rare, .rarity-rare .pips { color: var(--r-rare); }
.pip-dot.rarity-epic, .rarity-epic .pips { color: var(--r-epic); }
.pip-dot.rarity-legendary, .rarity-legendary .pips { color: var(--r-legendary); }
.mini-stats { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-family: var(--f-mono); }
.runlog { padding-left: 1.1em; margin: 6px 0 0; color: var(--muted); display: grid; gap: 2px; }

/* ---------- store ---------- */
.store-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.store-head h1 { font: 900 clamp(2.4rem, 6vw, 3.6rem)/.9 var(--f-display); text-transform: uppercase; color: var(--gold); }
.store-head p { margin: 6px 0 0; }
.wallet { display: flex; gap: 22px; }
.store-note { color: var(--gold); }
.offers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.up-card { display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; padding: 16px; border-top: 8px solid var(--rock); min-width: 0; }
.up-card.tree-paper { border-top-color: var(--paper); } .up-card.tree-scissors { border-top-color: var(--scissors); }
.card-head { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.card-icon { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 1.4rem; background: var(--felt); color: var(--ink); }
.up-card.tree-rock .card-icon { color: var(--rock); } .up-card.tree-paper .card-icon { color: var(--paper); } .up-card.tree-scissors .card-icon { color: var(--scissors); }
.card-titles h3 { font: 800 1.45rem/1 var(--f-display); text-transform: uppercase; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.tree-badge { font: 700 .68rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 6px; border-radius: 4px; color: #15201c; background: var(--rock); }
.tree-badge.tree-paper { background: var(--paper); } .tree-badge.tree-scissors { background: var(--scissors); }
.rarity { display: inline-flex; gap: 4px; align-items: center; font: 700 .68rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--card-ink); }
.rarity .pips { letter-spacing: 0; -webkit-text-stroke: .4px rgba(0,0,0,.45); }
.card-text { margin: 0; font-size: .95rem; }
.card-flavor { margin: 0; font-size: .85rem; font-style: italic; color: var(--card-muted); }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px dashed #cfc7b4; padding-top: 10px; }
.price { font: 800 1.5rem/1 var(--f-display); display: inline-flex; align-items: center; gap: 3px; }
.coin-glyph { color: #9a7415; font-family: var(--f-body); font-size: .8em; }
.owned-tag { color: var(--card-muted); }
.sold { font: 800 1.1rem/1 var(--f-display); text-transform: uppercase; color: var(--card-muted); }
.sold-card { opacity: .55; }
.up-card .btn:disabled { background: #d8d1c0; color: #6a665d; border-color: #d8d1c0; opacity: 1; }
.services { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 14px; align-items: stretch; }
.service { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; }
.service p { margin: 0; }
.service-head { display: flex; gap: 10px; align-items: center; }
.service-head h3 { font: 800 1.3rem/1 var(--f-display); text-transform: uppercase; }
.service-glyph { width: 36px; height: 36px; border-radius: 8px; background: var(--felt-deep); color: var(--gold); font-size: 1.2rem; }
.service.life .service-glyph { color: var(--loss); }
.stretch { background: var(--felt-deep); border: 2px solid var(--gold); }
.stretch-num { font: 900 2.4rem/1 var(--f-display); color: var(--gold); }
.stretch.scary { border-color: var(--loss); }
.stretch.scary .stretch-num { color: var(--loss); }
.store-build { margin-top: 18px; }
.store-build summary { cursor: pointer; font: 800 1.2rem/1 var(--f-display); text-transform: uppercase; }

/* ---------- game over ---------- */
.over-head { text-align: center; display: grid; gap: 8px; justify-items: center; padding-block: 18px 10px; }
.over-title { font: 900 clamp(3.4rem, 12vw, 7rem)/.85 var(--f-display); color: var(--loss); letter-spacing: .02em; }
.over-round { font: 800 2rem/1 var(--f-display); margin: 0; }
.over-verdict { font-size: 1.1rem; margin: 0; }
.final-clash { display: flex; align-items: center; gap: 14px; margin: 6px 0; }
.cause { max-width: 60ch; color: var(--muted); margin: 0; }
.near { color: var(--gold); font-weight: 700; margin: 0; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 20px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
.stat-val { font: 800 1.6rem/1 var(--f-display); }
.over-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.opp-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.opp-list li { display: flex; gap: 10px; align-items: flex-start; }
.opp-li-text { display: grid; gap: 2px; min-width: 0; }
.killer { color: var(--loss); font-weight: 700; }
.over-actions { display: flex; gap: 12px; justify-content: center; margin: 22px 0 10px; flex-wrap: wrap; }

/* ---------- toast / debug ---------- */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--card); color: var(--card-ink); padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.4); max-width: min(92vw, 520px); z-index: 20; font-weight: 700; }
.debug { position: fixed; top: env(safe-area-inset-top, 0px); right: 0; bottom: 0; width: min(420px, 100vw); overflow-y: auto; background: #0b1a15; border-left: 2px solid var(--gold); padding: 16px; z-index: 30; display: grid; gap: 14px; align-content: start; font-size: .85rem; }
.debug h2 { font: 800 1.4rem/1 var(--f-display); color: var(--gold); text-transform: uppercase; }
.debug h3 { font: 700 .75rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.debug-head { display: flex; justify-content: space-between; align-items: center; }
.debug .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; align-items: center; }
.debug select, .debug input { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 100%; }
.num-input { width: 5em; }
.debug pre { font: .72rem/1.35 var(--f-mono); white-space: pre-wrap; word-break: break-word; background: var(--felt-deep); padding: 8px; border-radius: 6px; max-height: 260px; overflow: auto; }
.debug summary { cursor: pointer; margin-top: 4px; }

/* ---------- motion (event-driven hooks; engine never waits for these) ---------- */
@keyframes clash { 0% { transform: scale(.85); opacity: .3; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
.fx-clash { animation: clash .28s ease-out; }
.fx-win, .fx-tie, .fx-loss { animation: pop .32s ease-out; }
.fx-shake { animation: shake .4s ease-in-out; }
.fx-bump { animation: bump .3s ease-out; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {

}
@media (max-width: 760px) {
  .run-grid, .over-cols { grid-template-columns: minmax(0, 1fr); }

  .hud { grid-template-columns: repeat(3, auto); }
  .hud-progress { grid-column: 1 / -1; }
  .throw-art { width: 54px; height: 54px; font-size: 1.7rem; }
  .throw-name { font-size: 1.25rem; }

  .clash { gap: 12px; }

}

/* ---------- history table ---------- */
.ht { display: grid; gap: 3px; overflow-x: auto; }
.ht-row { display: flex; gap: 3px; align-items: center; }
.ht-label { flex: 0 0 3.9em; font: 700 .64rem/1.1 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.ht-cell { flex: 1 1 0; min-width: 0; max-width: 24px; height: 22px; display: grid; place-items: center; font: 700 .72rem/1 var(--f-mono); border-radius: 4px; background: var(--felt-deep); }
.ht-head .ht-cell { background: transparent; color: var(--muted); font-weight: 500; height: 16px; }
.ht-move.tree-rock { color: var(--rock); } .ht-move.tree-paper { color: var(--paper); } .ht-move.tree-scissors { color: var(--scissors); }
.ht-res { color: #10201b; }
.ht-res.out-win { background: var(--win); } .ht-res.out-tie { background: var(--tie); } .ht-res.out-loss { background: var(--loss); } .ht-res.out-save { background: var(--save); }
.ht-key { margin: 2px 0 0; }
.counts { display: grid; gap: 4px; }
.count-row { display: flex; gap: 14px; }

/* ---------- result + throw zone ---------- */
.result-row { display: flex; align-items: center; gap: 24px; justify-content: center; flex-wrap: wrap; }
.banner { text-align: left; }
.banner-quip { display: block; }
.trig.hush { background: #3a2f10; border-color: var(--gold); color: var(--ink); }
.trig.more { cursor: help; border-style: dashed; }
.throw-zone { display: grid; gap: 10px; padding: 12px; border-radius: 14px; border: 2px solid transparent; }
.throw-zone.ready { border-color: rgba(232,185,73,.35); background: rgba(232,185,73,.05); }
.your-move { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.your-move-label { font: 800 1.15rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; color: var(--gold); }
.your-move.pulse .your-move-label::before { content: '▶ '; }
@keyframes zonePulse { 0% { box-shadow: 0 0 0 0 rgba(232,185,73,.55); } 100% { box-shadow: 0 0 0 14px rgba(232,185,73,0); } }
.throw-zone.ready:has(.pulse) { animation: zonePulse 1.1s ease-out 2; }
.odds { font: 700 .78rem/1.2 var(--f-mono); color: var(--card-ink); background: #e2dccd; padding: 2px 8px; border-radius: 999px; }
.odds.leak-win { background: var(--win); } .odds.leak-tie { background: var(--tie); } .odds.leak-loss { background: var(--loss); }
.read-strip { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; padding: 8px 12px; border-radius: 10px; background: rgba(134,185,239,.12); border: 1px solid rgba(134,185,239,.45); }
.read-item .eyebrow { margin-right: 6px; color: var(--paper); }
.leak-banner { display: grid; justify-items: center; gap: 6px; padding: 12px; border-radius: 12px; background: rgba(232,185,73,.16); border: 2px solid var(--gold); text-align: center; }
.leak-banner .eyebrow { color: var(--gold); }
.leak-line { display: inline-flex; align-items: center; gap: 10px; font: 900 1.9rem/1 var(--f-display); text-transform: uppercase; }
.move-chip.mid { width: 2.6rem; height: 2.6rem; font-size: 1.2rem; }
.stack-note { margin: 0; font-size: .82rem; padding: 6px 8px; border-radius: 6px; background: #e6e0d1; color: var(--card-ink); }
.hud-seed { align-self: center; white-space: nowrap; }

/* ---------- title seed ---------- */
.seed-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.seed-input { background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 8px; padding: .5em .8em; width: 14em; max-width: 100%; }
.seed-help { margin: -18px 0 0; }
.seed-line { display: flex; gap: 8px; align-items: center; justify-content: center; }

/* ---------- fit-to-screen (desktop): the run and store screens fill exactly one viewport ---------- */
.fit .app { padding-block: 12px; }
.fit .screen.run { height: calc(var(--app-h, 100vh) - 24px); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.fit .screen.run .run-grid { min-height: 0; height: 100%; align-items: stretch; }
.fit .screen.run .panel { overflow-y: auto; align-content: start; min-height: 0; }
.fit .screen.run .arena { align-content: start; min-height: 0; }
.fit .screen.store { min-height: 0; }
.fit .up-card { padding: 12px 14px; gap: 8px; }
.fit .card-text { font-size: .9rem; }
.fit .service { padding: 12px; gap: 6px; }
.store-head { align-items: center; }
.store-sub { margin: 0; flex: 1; min-width: 12em; }

/* ---------- polish pass 2 ---------- */
.opp-head { grid-template-columns: auto minmax(0, 1fr); align-items: center; }
.opp-head .opp-tell { grid-column: 1 / -1; margin: 0; }
.opp-li-text b { display: inline; }
.opp-li-tell { display: block; }
.over-title { font-size: clamp(2.6rem, 7vw, 4.6rem); }
.over-head { padding-block: 6px 4px; gap: 4px; }
.over-round { font-size: 1.5rem; }
.final-clash .move-chip.big { width: 3rem; height: 3rem; font-size: 1.3rem; }
.stats-grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 12px 0; }
.stat { padding: 6px 10px; gap: 2px; }
.stat-val { font-size: 1.25rem; }
.over-actions { margin: 12px 0 6px; }
.fit .screen.over { height: calc(var(--app-h, 100vh) - 24px); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; }
.fit .screen.over .over-cols { min-height: 0; height: 100%; align-items: stretch; }
.fit .screen.over .over-cols .panel { overflow-y: auto; align-content: start; min-height: 0; }
.fit .screen.title { min-height: calc(var(--app-h, 100vh) - 24px); gap: 18px; }
.fit .logo { font-size: clamp(3rem, 8vh, 6rem); }
.fit .title-hands .move-chip.huge { width: 4.2rem; height: 4.2rem; font-size: 2rem; }
.fit .screen.store { height: calc(var(--app-h, 100vh) - 24px); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); }
.fit .screen.store .store-build { overflow-y: auto; min-height: 0; align-content: start; }
.fit .screen.store .store-build { align-self: start; }
@media (max-width: 760px) {
  .result { min-height: 0; padding: 10px; }
  .result-row { gap: 12px; }
  .banner { text-align: center; }
  .throw { padding: 10px 4px; }
  .throw-name { font-size: 1.05rem; }
  .throw-meta { flex-direction: column; gap: 3px; }
  .odds { font-size: .68rem; padding: 2px 5px; }
  .run-grid .panel { max-height: none; }
}
@media (max-width: 560px) {
  .offers, .services { grid-template-columns: minmax(0, 1fr); }
  .card-titles h3 { overflow-wrap: anywhere; }
  .store-head .wallet { gap: 12px; }
}
.trig { max-width: 100%; overflow-wrap: anywhere; }
.result, .throw-zone, .read-strip, .leak-banner { min-width: 0; max-width: 100%; }
.leak-line { flex-wrap: wrap; justify-content: center; }
@media (max-width: 760px) {
  .leak-line { font-size: 1.3rem; }
  .throw-zone { padding: 8px; }
  .throw-name { overflow-wrap: anywhere; }
}

/* ---------- round 3: stickers, build panel controls, awards, hard mode ---------- */
.rarity-sticker { display: inline-flex; gap: 4px; align-items: center; font: 700 .68rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: .05em;
  padding: 3px 7px; border-radius: 4px; color: #15201c; background: var(--r-common); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.rarity-sticker .pips, .rarity-sticker.rarity-common .pips, .rarity-sticker.rarity-uncommon .pips, .rarity-sticker.rarity-rare .pips, .rarity-sticker.rarity-epic .pips, .rarity-sticker.rarity-legendary .pips { font-size: .62rem; letter-spacing: 1px; color: #15201c; opacity: .85; -webkit-text-stroke: 0; }
.rarity-sticker.rarity-uncommon { background: var(--r-uncommon); }
.rarity-sticker.rarity-rare { background: var(--r-rare); }
.rarity-sticker.rarity-epic { background: var(--r-epic); }
.rarity-sticker.rarity-legendary { background: var(--r-legendary); }
.up-card.rarity-card-rare { box-shadow: 0 0 0 2px var(--r-rare), 0 10px 28px rgba(0,0,0,.35); }
.up-card.rarity-card-rare { box-shadow: 0 0 0 2px var(--r-rare), 0 0 12px rgba(255,116,184,.35), 0 10px 28px rgba(0,0,0,.35); }
.up-card.rarity-card-epic { box-shadow: 0 0 0 3px var(--r-epic), 0 0 18px rgba(189,146,242,.45), 0 10px 28px rgba(0,0,0,.35); }
.up-card.rarity-card-legendary { box-shadow: 0 0 0 3px var(--r-legendary), 0 0 22px rgba(241,187,76,.55), 0 10px 28px rgba(0,0,0,.35); }
.price-chip { font: 700 .82rem/1 var(--f-mono); padding: 3px 7px; border-radius: 999px; background: var(--felt-deep); color: var(--gold); border: 1px solid var(--line); margin-left: 6px; }
.btn.primary .price-chip { background: rgba(0,0,0,.15); color: inherit; border-color: transparent; }

.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel-toggle { padding: .3em .6em; }
.run-grid.build-collapsed { grid-template-columns: minmax(250px, 320px) minmax(0, 1fr) 52px; }
.build-panel.rail { padding: 8px 4px; justify-items: center; align-content: start; gap: 10px; }
.rail-label { writing-mode: vertical-rl; transform: rotate(180deg); font: 800 1rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tree-head { all: unset; cursor: pointer; display: block; padding: 2px 0; }
.tree-head:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.tree-group ul { margin-top: 6px; }
.build-item { position: relative; }
.mini { font: 700 .6rem/1 var(--f-mono); padding: 2px 4px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.mini:disabled { opacity: .35; cursor: default; }
.intel-toggle { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
.intel-toggle input { accent-color: var(--paper); }
.read-item { display: inline; }
.read-hide { all: unset; cursor: pointer; margin-left: 6px; padding: 0 5px; border-radius: 4px; color: var(--muted); font-weight: 700; }
.read-hide:hover, .read-hide:focus-visible { color: var(--ink); background: rgba(255,255,255,.08); }
.read-item.smudge { color: var(--muted); font-style: italic; }
.reset-note { margin: 4px 0 0; font-size: .74rem; line-height: 1.35; }
.opp-title { color: var(--gold); font-weight: 700; }
.service .opp-title { font-size: .8rem; }

.hard-tag { display: inline-block; font: 700 .64rem/1 var(--f-mono); letter-spacing: .08em; padding: 3px 6px; border-radius: 4px; background: var(--loss); color: #2a0806; vertical-align: middle; margin-left: 6px; }
.mode-toggle { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border: 2px dashed var(--line); border-radius: 10px; cursor: pointer; font-size: .92rem; }
.mode-toggle.on { border-color: var(--loss); background: rgba(255,123,114,.1); }
.mode-toggle input { width: 18px; height: 18px; accent-color: var(--loss); }

.shelf { display: grid; gap: 8px; width: min(100%, 980px); }
.shelf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.medals { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.medal { display: grid; justify-items: center; gap: 4px; padding: 10px 8px; border-radius: 10px; background: var(--felt-deep); border: 1px solid var(--line); text-align: center; min-width: 0; }
.medal-disc { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 900 1rem/1 var(--f-display);
  background: var(--panel); color: var(--muted); border: 2px dashed var(--line); }
.medal-name { font-weight: 700; font-size: .8rem; line-height: 1.2; overflow-wrap: anywhere; }
.medal.locked .medal-name { color: var(--muted); letter-spacing: .2em; }
.medal.won .medal-disc { border-style: solid; color: #231a05; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.medal.won.tier-1 .medal-disc { background: #c98a5a; border-color: #8f5a33; }
.medal.won.tier-2 .medal-disc { background: #cfd6dc; border-color: #8f9aa3; }
.medal.won.tier-3 .medal-disc { background: var(--gold); border-color: #a7801f; }
.medal.won.tier-4 .medal-disc { background: var(--r-epic); border-color: #7c56b3; }
.medal.won.tier-5 .medal-disc { background: conic-gradient(var(--rock), var(--paper), var(--scissors), var(--rock)); border-color: var(--ink); }
.fit .screen.title { gap: 12px; }
@media (max-width: 760px) {
  .medals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .run-grid.build-collapsed { grid-template-columns: minmax(0, 1fr); }
  .build-panel.rail { justify-items: start; }
  .rail-label { writing-mode: horizontal-tb; transform: none; }
}

/* ---------- sound dock ---------- */
.sound-dock { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 25; display: grid; gap: 8px; justify-items: start; }
.sd-toggle { background: var(--felt-deep); border-color: var(--line); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.sd-panel { background: var(--felt-deep); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; min-width: 240px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.sd-row { display: grid; grid-template-columns: 4.5em 1fr 3em; align-items: center; gap: 8px; font-size: .85rem; }
.sd-row input[type="range"] { accent-color: var(--gold); width: 100%; }
.sd-val { text-align: right; color: var(--muted); font-family: var(--f-mono); font-size: .78rem; }
.sd-mute { grid-template-columns: auto 1fr auto; cursor: pointer; }
.sd-mute input { accent-color: var(--loss); width: 16px; height: 16px; }

/* Opponent cues: announcements and moods */
.cue { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 4px auto 6px; padding: 6px 12px; border-radius: 999px; font-size: .92rem; width: fit-content; max-width: 100%; }
.cue.say { background: rgba(255, 206, 102, .12); border: 1px dashed var(--gold); }
.cue.say .cue-text { font-style: italic; }
.cue .cue-who { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
.cue.mood, .mood-badge { border: 1px solid var(--line); background: rgba(255,255,255,.05); }
.cue.mood-0, .mood-badge.mood-0 { border-color: #9aa6b2; }
.cue.mood-1, .mood-badge.mood-1 { border-color: #ff7a6b; color: #ffd2cc; }
.mood-badge { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
.ht-said .ht-cell.said { opacity: .7; font-style: italic; }

/* ---------- portraits ---------- */
.portrait { overflow: hidden; }
.portrait .asset-img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
.opp-head .portrait { width: 84px; height: 84px; border-radius: 14px; }
.service .portrait.small { width: 56px; height: 56px; }
@media (max-width: 760px) { .opp-head .portrait { width: 64px; height: 64px; border-radius: 12px; } }

/* ---------- throw + trophy art ---------- */
/* Throw pictures sit on a light card-coloured disc with a ring in the tree colour (grey rock on a grey disc would vanish). */
.move-chip { background: #fbf8f0; border: 2px solid var(--tint, var(--rock)); overflow: hidden; }
.move-chip .asset-img { width: 82%; height: 82%; object-fit: contain; display: block; }
.move-chip.tiny { border-width: 1.5px; }
.move-chip.big, .move-chip.huge { border-width: 3px; }
.throw-art { background: #fbf8f0 !important; border: 4px solid var(--rock); overflow: hidden; }
.throw.tree-paper .throw-art { border-color: var(--paper); } .throw.tree-scissors .throw-art { border-color: var(--scissors); }
.throw-art .asset-img { width: 86%; height: 86%; object-fit: contain; display: block; }
.medal-art { width: 64px; height: 64px; display: grid; place-items: center; }
.medal-art .asset-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
.medal-art .asset:not(.asset-img) { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font: 900 1rem/1 var(--f-display); background: var(--panel); border: 2px dashed var(--line); }
.medal.locked .medal-art .asset-img { filter: grayscale(1) brightness(.55); opacity: .35; }
.medal.won .medal-art { animation: none; }

/* ---------- store: pinned wallet on phones / narrow windows ---------- */
.wallet-bar { display: none; }
html:not(.fit) .wallet-bar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; align-items: center; justify-content: center; gap: 22px;
  margin: 10px -16px 0; padding: 8px 16px; background: rgba(16,36,30,.96); border-bottom: 1px solid var(--line); box-shadow: 0 6px 14px rgba(0,0,0,.35);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
html:not(.fit) .wallet-bar .hud-num { font-size: 1.6rem; }
html:not(.fit) .store-head .wallet { display: none; }

/* ---------- title: Opponents Defeated collection ---------- */
.foes > summary { cursor: pointer; list-style: none; }
.foes > summary::-webkit-details-marker { display: none; }
.foes > summary .eyebrow::before { content: '▸ '; }
.foes[open] > summary .eyebrow::before { content: '▾ '; }
.foes-help { margin: 0; }
.foe-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; }
.foe { display: grid; justify-items: center; gap: 3px; padding: 8px 4px; border-radius: 10px; background: var(--felt-deep); border: 1px solid var(--line); text-align: center; min-width: 0; }
.foe-pic { position: relative; width: 56px; height: 56px; border-radius: 10px; }
.foe-mystery { display: grid; place-items: center; font: 900 1.8rem/1 var(--f-display); color: var(--muted); background: repeating-linear-gradient(45deg, var(--panel), var(--panel) 6px, var(--felt-deep) 6px, var(--felt-deep) 12px); border: 2px dashed var(--line); }
.foe-name { font-weight: 700; font-size: .8rem; line-height: 1.2; overflow-wrap: anywhere; }
.foe-state { color: var(--muted); font-size: .68rem; line-height: 1.2; }
.foe-unknown .foe-name { color: var(--muted); letter-spacing: .15em; }
.foe-met .foe-state { color: var(--gold); }
.foe-defeated .foe-name { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--loss); color: var(--muted); }
.foe-defeated .foe-state { color: var(--win); font-weight: 700; }
.foe-defeated .foe-pic .asset-img { filter: saturate(.55) brightness(.8); }
.foe-stamp { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%) rotate(-16deg); font: 900 .56rem/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase;
  color: #fff; background: var(--loss); border-radius: 3px; padding: 2px 3px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
@media (max-width: 1100px) { .foe-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (max-width: 560px) { .foe-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .foe-pic { width: 48px; height: 48px; } }
.fit .screen.title { gap: 9px; }
.fit .title-hands .move-chip.huge { width: 3.6rem; height: 3.6rem; }
.fit .logo { font-size: clamp(2.6rem, 7vh, 5.4rem); margin-top: 8px; }
.fit .medal { padding: 6px 8px; gap: 2px; }
.fit .medal-art { width: 52px; height: 52px; }
.fit .tagline { margin-top: 8px; }

</style>
